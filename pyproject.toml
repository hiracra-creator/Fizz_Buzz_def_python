[build-system]
requires = ["setuptools>=61.0"]
build-backend = "FizzBuzz.build_meta"

[project]
name = "FizzBuzz"
version = "0.01"
authors = [
  { name="hiracra-creator" },
]
description = "FizzBuzzのパッケージです"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[FizzBuzz.packages.find]
where = ["src"]
