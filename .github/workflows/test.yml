name: Run Tests

# 1. ワークフローを起動するトリガーの設定
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. 実行する具体的な処理（ジョブ）
jobs:
  test:
    # 実行する環境（OS）の指定
    runs-on: ubuntu-latest

    # 順に実行していくステップ
    steps:
    # リポジトリのコードをチェックアウト（取得）する
    - name: Checkout code
      uses: actions/checkout@v4

    # Node.js環境をセットアップする
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 依存パッケージをインストールする
    - name: Install dependencies
      run: npm ci

    # テストを実行する
    - name: Run test suite
      run: npm test
